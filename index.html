  <style>
    :root {
      /* Paleta INDIGO IA */
      --brand: #7b2ff0;          /* violeta de botones */
      --brand-deep: #2a1d5c;     /* índigo oscuro del degradé */
      --brand-light: #a98bff;    /* lila para texto/íconos sobre fondo oscuro */

      --brand-soft: color-mix(in srgb, var(--brand) 16%, transparent);
      --brand-line: color-mix(in srgb, var(--brand) 28%, transparent);
      --bg: #100c26;
      --surface: #17123a;
      --surface-2: #1f1946;
      --text: #f4f2fb;
      --muted: #a29fbd;
      --radius: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(120% 60% at 50% -10%, color-mix(in srgb, var(--brand) 30%, transparent) 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--brand-line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .6);
    }

    /* ---------- Cabecera ---------- */
    .cover {
      height: 76px;
      background:
        linear-gradient(115deg, var(--brand-deep) 0%, #4a25a0 55%, #8b3fe6 100%);
      position: relative;
    }
    .cover::after {
      content: "";
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 22px 22px;
      mask-image: linear-gradient(180deg, #000 0%, transparent 100%);
    }

    .identity {
      padding: 0 24px 18px;
      text-align: center;
    }

    .avatar {
      width: 100px; height: 100px;
      margin: -50px auto 12px;
      border-radius: 50%;
      border: 4px solid var(--surface);
      outline: 2px solid var(--brand-light);
      background: var(--surface-2);
      position: relative;
      z-index: 1;
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar .initials {
      font-size: 36px; font-weight: 600; letter-spacing: .5px;
      font-family: "Montserrat", sans-serif;
      color: var(--brand-light);
      display: none;
    }
    .avatar.no-photo .initials { display: block; }

    h1 {
      font-family: "Montserrat", "Inter", sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -.3px;
      line-height: 1.2;
    }

    .role {
      margin-top: 6px;
      font-size: 15px;
      font-weight: 500;
      color: var(--brand-light);
    }

    .company {
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 999px;
      background: var(--brand-soft);
      border: 1px solid var(--brand-line);
      font-size: 13px;
      font-family: "Montserrat", sans-serif;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--text);
      text-decoration: none;
    }

    /* ---------- Acciones ---------- */
    .actions { padding: 0 20px 20px; }

    .save {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 50px;
      border-radius: 14px;
      background: var(--brand);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: filter .15s ease, transform .15s ease;
    }
    .save:hover { filter: brightness(1.08); }
    .save:active { transform: scale(.98); }

    .list {
      list-style: none;
      margin-top: 12px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 16px;
      overflow: hidden;
      background: var(--surface-2);
    }
    .list li + li { border-top: 1px solid rgba(255,255,255,.06); }

    .row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      color: inherit;
      text-decoration: none;
      transition: background .15s ease;
    }
    .row:hover { background: rgba(255,255,255,.03); }

    .ico {
      flex: none;
      width: 38px; height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--brand-soft);
      color: var(--brand-light);
    }
    .ico svg { width: 20px; height: 20px; }

    .txt { min-width: 0; flex: 1; }
    .label {
      display: block;
      font-size: 11.5px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .7px;
      color: var(--muted);
    }
    .value {
      display: block;
      margin-top: 2px;
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chev { flex: none; width: 16px; height: 16px; color: var(--muted); opacity: .7; }

    footer {
      padding: 12px 20px 14px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid rgba(255,255,255,.06);
    }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); }

    a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 10px; }
